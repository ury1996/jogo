# Modo demonstração com um comando:  docker compose up
# Abra http://localhost:8080/editor/  (demo@rankly.app / demo12345)
#
# Configuração opcional num arquivo .env ao lado deste (o Docker lê sozinho):
#   GEMINI_API_KEY=sua-chave              IA de verdade (sem ela, IA simulada)
#   RANKLY_URL=https://teste.exemplo.com  endereço público (servidor, túnel)
#   RANKLY_PORTA=8090                     outra porta no seu computador (se a 8080 estiver ocupada)
#   RANKLY_PORTA=127.0.0.1:8080           num servidor com Caddy/Nginx na frente (porta fechada para fora)
services:
  rankly:
    build: .
    ports:
      - "${RANKLY_PORTA:-8080}:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # sem RANKLY_URL: o endereço do seu computador, na porta escolhida
      RANKLY_URL: ${RANKLY_URL:-http://localhost:${RANKLY_PORTA:-8080}}
    volumes:
      - rankly-dados:/dados
    restart: unless-stopped
volumes:
  rankly-dados:
